# 构建 website/ 并发布到 GitHub Pages（自定义域名 studygrokbot.com）
# 启用方式：仓库 Settings → Pages → Source 选 “GitHub Actions”，Custom domain 填 studygrokbot.com 并勾选 Enforce HTTPS
# Enable: Settings → Pages → Source = GitHub Actions; Custom domain = studygrokbot.com; Enforce HTTPS
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  # 思源黑体版本（改这里会自动换缓存）/ Source Han Sans release tag (changing it busts the cache)
  SHS_VERSION: 2.005R

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # 主域名 / primary domain（与 site.config.mjs 默认值一致）
          SITE_URL: https://studygrokbot.com/
          BASE_PATH: /
          # Google Analytics 代码（仓库 Settings → Secrets and variables → Actions → Variables，完整的 <script> 片段）；没设置就不加统计
          # Google Analytics snippet (repository variable, the full <script> tag); unset = no analytics
          GOOGLE_ANALYTICS: ${{ vars.GOOGLE_ANALYTICS }}
      # 分享图（OG / X 卡片）：用思源黑体 SC 渲染 PNG。字体来自 Adobe 官方 Release，按版本缓存；仅构建时使用，网站页面不加载任何 web 字体。
      # Share cards: rendered with Source Han Sans SC from Adobe's official release, cached per version. Build-time only.
      - name: Cache Source Han Sans
        id: font-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/study-grokbot/fonts/source-han-sans-${{ env.SHS_VERSION }}
          key: source-han-sans-sc-otf-${{ env.SHS_VERSION }}
      - name: Fetch Source Han Sans
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: npm run font
      - name: Render OG images
        run: |
          npx playwright install --with-deps chromium
          npm run og
      - name: Validate
        run: npm run check
        env:
          SITE_URL: https://studygrokbot.com/
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
